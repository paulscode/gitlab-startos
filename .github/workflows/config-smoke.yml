name: Omnibus Config Smoke Test

# Boots the GitLab image this package ships and proves the configuration it
# generates still reconfigures cleanly.
#
# Omnibus *removes* configuration keys across releases, and a removed key is a
# hard abort rather than a warning: reconfigure refuses to run and the service
# never starts. Without this job the discovery event is a user's install failing
# after an update.
#
# Deliberately separate from the packaging workflows: it needs no signing key
# and publishes nothing, so it can run on every pull request.

on:
  workflow_dispatch:
  pull_request:
    branches: ['master']
    paths:
      - 'startos/omnibusConfig.ts'
      - 'startos/manifest/index.ts'
      - 'scripts/check-omnibus-config.mjs'
      - '.github/workflows/config-smoke.yml'
  # The image tag is pinned, but Omnibus can publish a rebuilt image under the
  # same tag, so re-check periodically rather than only on change.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  config-smoke:
    runs-on: ubuntu-latest
    # A full Chef converge plus database migrations, on top of pulling a 3.5 GB
    # image. Generous so a slow runner reports the real result, not a timeout.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The GitLab image is ~3.5 GB and the default runner has little headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - run: npm ci

      - name: Boot GitLab against the generated config
        run: node scripts/check-omnibus-config.mjs
